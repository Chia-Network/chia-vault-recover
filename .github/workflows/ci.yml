name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

# A new push to a pull request cancels the run it replaces. Push and release
# runs each get their own group, so they are neither queued nor cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Incremental compilation and sccache cache the same objects.
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install Linux GUI/build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config
      - run: cargo test --all

  # Release binaries do not need lint or test output. They start with those
  # jobs. Publishing stays downstream and still waits for every check.
  # Artifact upload uses ACTIONS_RUNTIME_TOKEN, not the contents scope.
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # Windows release exes are raw binaries. +crt-static is the MSVC /MT link,
    # so a clean machine does not need VCRUNTIME140.dll. release-build hashes
    # RUSTFLAGS into the cargo cache key. Other targets keep -Dwarnings.
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '-Dwarnings' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64
            cross: true
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            rustflags: "-Dwarnings -C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux deps (native)
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config

      - name: Install Linux aarch64 cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: ./.github/actions/release-build
        with:
          target: ${{ matrix.target }}
          cache-name: ${{ matrix.name }}
          artifact: ${{ matrix.artifact }}
          layout: suffixed
          cross: ${{ matrix.cross && 'true' || 'false' }}

  # Separate job id so lipo can start when the Apple compiles finish, without
  # waiting on the Windows build. The steps live in release-build.
  build-macos-arch:
    name: Build (${{ matrix.name }})
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            target: aarch64-apple-darwin
            artifact: macos-aarch64
          - name: macos-x86_64
            target: x86_64-apple-darwin
            artifact: macos-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/release-build
        with:
          target: ${{ matrix.target }}
          cache-name: ${{ matrix.name }}
          artifact: ${{ matrix.artifact }}
          layout: arch

  macos-universal:
    name: Build (macos-universal)
    needs: build-macos-arch
    # A failed or cancelled arch leg must fail this check, not skip it.
    # Branch protection treats a skipped required check as success, and
    # Build (macos-aarch64) / Build (macos-x86_64) are new names.
    # !cancelled() skips this job when the workflow itself is cancelled, so a
    # replaced pull request does not fail the check on a dead SHA.
    if: ${{ always() && !cancelled() }}
    runs-on: ${{ needs.build-macos-arch.result == 'success' && 'macos-latest' || 'ubuntu-latest' }}
    permissions: {}
    steps:
      - name: Require both Apple architecture builds
        if: ${{ needs.build-macos-arch.result != 'success' }}
        run: |
          echo "::error::Build (macos-universal) requires both Apple architecture builds to succeed (build-macos-arch result: ${{ needs.build-macos-arch.result }})"
          exit 1
      - name: Download aarch64 build
        uses: actions/download-artifact@v8
        with:
          name: chia-vault-recover-macos-aarch64
          path: aarch64
      - name: Download x86_64 build
        uses: actions/download-artifact@v8
        with:
          name: chia-vault-recover-macos-x86_64
          path: x86_64
      - name: Lipo universal binaries
        run: |
          mkdir -p dist
          lipo -create \
            aarch64/chia-vault-recover \
            x86_64/chia-vault-recover \
            -output dist/chia-vault-recover-macos-universal
          lipo -create \
            aarch64/chia-vault-recover-gui \
            x86_64/chia-vault-recover-gui \
            -output dist/chia-vault-recover-gui-macos-universal
          chmod +x dist/*
          lipo -info dist/chia-vault-recover-macos-universal
          lipo -info dist/chia-vault-recover-gui-macos-universal
      - name: Upload CI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chia-vault-recover-macos-universal
          path: dist/*
          if-no-files-found: error

  # Official macOS and Windows release assets are signed, then uploaded here.
  # Everything else is uploaded by the publish jobs below. All of them wait
  # until lint, tests, and every build have succeeded.
  sign:
    name: Sign (${{ matrix.os }})
    needs: [lint, test, build, macos-universal]
    if: ${{ success() && github.repository == 'Chia-Network/chia-vault-recover' && github.event_name == 'release' }}
    runs-on: ${{ matrix.runs-on }}
    environment: ${{ matrix.environment }}
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runs-on: macos-latest
            artifact: macos-universal
            sign: bash build-scripts/macos/sign-release.sh
          - os: windows
            runs-on: windows-latest
            artifact: windows-x86_64
            sign: pwsh -File ./build-scripts/windows/sign-release.ps1 -Artifact
            # Federated credential subject:
            # repo:Chia-Network/chia-vault-recover:environment:windows-code-signing
            environment: windows-code-signing
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: chia-vault-recover-${{ matrix.artifact }}
          path: dist

      - name: Check for Apple signing credentials
        if: matrix.os == 'macos'
        id: apple-signing
        shell: bash
        env:
          APPLE_SIGNING_ENABLED: "true"
          APPLE_DEV_ID_APP: ${{ secrets.APPLE_DEV_ID_APP }}
          APPLE_DEV_ID_APP_PASS: ${{ secrets.APPLE_DEV_ID_APP_PASS }}
          APPLE_NOTARIZE_USERNAME: ${{ secrets.APPLE_NOTARIZE_USERNAME }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$APPLE_SIGNING_ENABLED" != "true" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          configured=0
          for value in \
            "$APPLE_DEV_ID_APP" \
            "$APPLE_DEV_ID_APP_PASS" \
            "$APPLE_NOTARIZE_USERNAME" \
            "$APPLE_NOTARIZE_PASSWORD" \
            "$APPLE_TEAM_ID"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "$configured" -eq 5 ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [[ "$configured" -eq 0 ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Apple signing is partially configured; all five Apple secrets are required"
            exit 1
          fi

      - name: Check for Windows signing credentials
        if: matrix.os == 'windows'
        id: windows-signing
        shell: bash
        env:
          WINDOWS_SIGNING_ENABLED: "true"
          AZURE_SIGNING_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          AZURE_SIGNING_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
        run: |
          if [[ "$WINDOWS_SIGNING_ENABLED" != "true" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            configured=0
            for value in "$AZURE_SIGNING_CLIENT_ID" "$AZURE_SIGNING_TENANT_ID"; do
              if [[ -n "$value" ]]; then
                configured=$((configured + 1))
              fi
            done
            if [[ "$configured" -eq 2 ]]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
            elif [[ "$configured" -eq 0 ]]; then
              echo "available=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Windows signing is partially configured; both Azure signing secrets are required"
              exit 1
            fi
          fi

      # Gatekeeper will not launch the signed GUI Mach-O. Bundle it before
      # the Developer ID signature so the sealed app, not a bare executable,
      # is what gets notarized inside the disk image.
      - name: Bundle macOS GUI
        if: matrix.os == 'macos'
        run: bash build-scripts/macos/package-app.sh ${{ matrix.artifact }}

      - name: Sign binaries
        if: steps.apple-signing.outputs.available == 'true' || steps.windows-signing.outputs.available == 'true'
        shell: bash
        env:
          APPLE_DEV_ID_APP: ${{ secrets.APPLE_DEV_ID_APP }}
          APPLE_DEV_ID_APP_PASS: ${{ secrets.APPLE_DEV_ID_APP_PASS }}
          APPLE_NOTARIZE_USERNAME: ${{ secrets.APPLE_NOTARIZE_USERNAME }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_SIGNING_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          AZURE_SIGNING_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
        run: ${{ matrix.sign }} ${{ matrix.artifact }}

      - name: Package macOS disk image
        if: matrix.os == 'macos'
        run: bash build-scripts/macos/package-dmg.sh ${{ matrix.artifact }}

      - name: Notarize macOS disk image
        if: matrix.os == 'macos' && steps.apple-signing.outputs.available == 'true'
        shell: bash
        env:
          APPLE_DEV_ID_APP: ${{ secrets.APPLE_DEV_ID_APP }}
          APPLE_DEV_ID_APP_PASS: ${{ secrets.APPLE_DEV_ID_APP_PASS }}
          APPLE_NOTARIZE_USERNAME: ${{ secrets.APPLE_NOTARIZE_USERNAME }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash build-scripts/macos/notarize-dmg.sh ${{ matrix.artifact }}

      - name: Upload release assets
        uses: ./.github/actions/upload-release-assets

  # Wait for sign so a notarization or signing failure does not leave Linux
  # assets on the release. On an official release, sign is not skipped.
  publish-linux:
    name: Publish Linux release assets
    needs: [lint, test, build, macos-universal, sign]
    if: ${{ success() && github.event_name == 'release' && github.repository == 'Chia-Network/chia-vault-recover' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download Linux build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: chia-vault-recover-linux-*
          path: dist
          merge-multiple: true
      - name: Upload release assets
        uses: ./.github/actions/upload-release-assets

  # Forks have no signing credentials and no sign job. One job packages the
  # disk image and then uploads every platform, so a packaging failure does
  # not leave the other assets on the release. The arch artifacts are not
  # downloaded: their unsuffixed filenames would collide and fail renaming.
  publish-fork:
    name: Publish fork release assets
    needs: [lint, test, build, macos-universal]
    if: ${{ success() && github.event_name == 'release' && github.repository != 'Chia-Network/chia-vault-recover' }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download Linux x86_64
        uses: actions/download-artifact@v8
        with:
          name: chia-vault-recover-linux-x86_64
          path: dist
      - name: Download Linux aarch64
        uses: actions/download-artifact@v8
        with:
          name: chia-vault-recover-linux-aarch64
          path: dist
      - name: Download Windows x86_64
        uses: actions/download-artifact@v8
        with:
          name: chia-vault-recover-windows-x86_64
          path: dist
      - name: Download macOS universal
        uses: actions/download-artifact@v8
        with:
          name: chia-vault-recover-macos-universal
          path: dist
      - name: Package macOS release disk image
        run: |
          bash build-scripts/macos/package-app.sh macos-universal
          bash build-scripts/macos/package-dmg.sh macos-universal
      - name: Upload release assets
        uses: ./.github/actions/upload-release-assets
