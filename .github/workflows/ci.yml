name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI/build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config
      - run: cargo test --all

  build:
    name: Build (${{ matrix.name }})
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    # Repo default token is read-only; attaching files to a published release
    # needs contents:write (softprops/action-gh-release updates the release).
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64
            cross: true
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            # Azure Artifact Signing federated credential subject is
            # repo:<org>/<repo>:environment:windows-code-signing
            sign-environment: windows-code-signing
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            artifact: macos-universal
            universal: true
    environment: ${{ matrix.sign-environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.universal && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Linux deps (native)
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config

      - name: Install Linux aarch64 cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          # GUI crate needs display libs; for aarch64 cross-build CLI only if GUI fails.
          # Prefer building both with pkg-config disabled for egui optional path — build release both bins.
          rustup target add aarch64-unknown-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build (native)
        if: ${{ !matrix.universal && !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (linux aarch64)
        if: matrix.cross
        run: |
          # Build CLI always; GUI may need extra cross libs — try both, fall back to CLI-only for GUI failure.
          cargo build --release --target aarch64-unknown-linux-gnu --bin chia-vault-recover
          cargo build --release --target aarch64-unknown-linux-gnu --bin chia-vault-recover-gui || \
            echo "GUI cross-build skipped/failed; CLI artifact still produced"

      - name: Build macOS universal
        if: matrix.universal
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/chia-vault-recover \
            target/x86_64-apple-darwin/release/chia-vault-recover \
            -output dist/chia-vault-recover-${{ matrix.artifact }}
          lipo -create \
            target/aarch64-apple-darwin/release/chia-vault-recover-gui \
            target/x86_64-apple-darwin/release/chia-vault-recover-gui \
            -output dist/chia-vault-recover-gui-${{ matrix.artifact }}
          chmod +x dist/*

      - name: Stage artifacts (non-universal)
        if: ${{ !matrix.universal }}
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then EXT=".exe"; fi
          TARGET_DIR="target/${{ matrix.target }}/release"
          cp "$TARGET_DIR/chia-vault-recover${EXT}" "dist/chia-vault-recover-${{ matrix.artifact }}${EXT}"
          if [[ -f "$TARGET_DIR/chia-vault-recover-gui${EXT}" ]]; then
            cp "$TARGET_DIR/chia-vault-recover-gui${EXT}" "dist/chia-vault-recover-gui-${{ matrix.artifact }}${EXT}"
          fi

      - name: Vault login
        if: github.event_name == 'release' && (matrix.universal || matrix.sign-environment)
        uses: Chia-Network/actions/vault/login@main
        with:
          vault_url: ${{ secrets.VAULT_URL }}
          role_name: github-chia-vault-recover

      - name: Read Apple signing secrets
        if: github.event_name == 'release' && matrix.universal
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          token: ${{ env.VAULT_TOKEN }}
          secrets: |
            secret/data/code-signing/apple dev_id_app | APPLE_DEV_ID_APP ;
            secret/data/code-signing/apple dev_id_app_pass | APPLE_DEV_ID_APP_PASS ;
            secret/data/code-signing/apple notarize_username | APPLE_NOTARIZE_USERNAME ;
            secret/data/code-signing/apple notarize_password | APPLE_NOTARIZE_PASSWORD ;
            secret/data/code-signing/apple team_id | APPLE_TEAM_ID ;

      - name: Delete keychain if it already exists
        if: github.event_name == 'release' && matrix.universal
        run: security delete-keychain signing_temp.keychain || true

      - name: Import Apple app signing certificate
        if: github.event_name == 'release' && matrix.universal
        run: |
          if [ -z "$APPLE_DEV_ID_APP" ] || [ -z "$APPLE_DEV_ID_APP_PASS" ]; then
            echo "Release builds require Vault secrets secret/data/code-signing/apple dev_id_app and dev_id_app_pass." >&2
            exit 1
          fi
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$APPLE_DEV_ID_APP" | base64 --decode > "$RUNNER_TEMP/apple-dev-id-app.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" signing_temp.keychain
          security set-keychain-settings -lut 21600 signing_temp.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" signing_temp.keychain
          security import "$RUNNER_TEMP/apple-dev-id-app.p12" -f pkcs12 -k signing_temp.keychain -P "$APPLE_DEV_ID_APP_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" signing_temp.keychain
          security list-keychains -d user -s signing_temp.keychain
          rm -f "$RUNNER_TEMP/apple-dev-id-app.p12"

      - name: Sign and notarize macOS binaries
        if: github.event_name == 'release' && matrix.universal
        run: |
          if [ -z "$APPLE_NOTARIZE_USERNAME" ] || [ -z "$APPLE_NOTARIZE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Release builds require Vault secrets secret/data/code-signing/apple notarize_username, notarize_password, and team_id." >&2
            exit 1
          fi
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No Developer ID Application identity in signing_temp.keychain." >&2
            exit 1
          fi
          for bin in dist/chia-vault-recover-macos-universal dist/chia-vault-recover-gui-macos-universal; do
            codesign --force --timestamp --options runtime --entitlements build-scripts/macos/entitlements.plist --sign "$SIGNING_IDENTITY" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done
          ditto -c -k dist "$RUNNER_TEMP/macos-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/macos-notarize.zip" --apple-id "$APPLE_NOTARIZE_USERNAME" --password "$APPLE_NOTARIZE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          rm -f "$RUNNER_TEMP/macos-notarize.zip"

      - name: Delete signing keychain
        if: always() && github.event_name == 'release' && matrix.universal
        run: security delete-keychain signing_temp.keychain || true

      - name: Read Azure signing secrets
        if: github.event_name == 'release' && matrix.sign-environment
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          token: ${{ env.VAULT_TOKEN }}
          secrets: |
            secret/data/code-signing/azure tenant_id | AZURE_SIGNING_TENANT_ID ;
            secret/data/code-signing/azure client_id | AZURE_SIGNING_CLIENT_ID ;

      - name: Check Azure signing secrets
        id: azure_signing
        if: github.event_name == 'release' && matrix.sign-environment
        shell: bash
        run: |
          if [ -z "$AZURE_SIGNING_TENANT_ID" ] || [ -z "$AZURE_SIGNING_CLIENT_ID" ]; then
            echo "Release builds require Vault secrets secret/data/code-signing/azure tenant_id and client_id." >&2
            exit 1
          fi
          {
            echo "tenant_id<<EOF"
            echo "$AZURE_SIGNING_TENANT_ID"
            echo "EOF"
            echo "client_id<<EOF"
            echo "$AZURE_SIGNING_CLIENT_ID"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Sign Windows binaries
        if: github.event_name == 'release' && matrix.sign-environment
        uses: Chia-Network/actions/sign/azure-windows@main
        with:
          azure_tenant_id: ${{ steps.azure_signing.outputs.tenant_id }}
          azure_client_id: ${{ steps.azure_signing.outputs.client_id }}
          file: |
            ${{ github.workspace }}/dist/chia-vault-recover-windows-x86_64.exe
            ${{ github.workspace }}/dist/chia-vault-recover-gui-windows-x86_64.exe

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chia-vault-recover-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
