name: Release build
description: Build one release target and upload the CI artifact.
inputs:
  target:
    description: Rust target triple
    required: true
  cache-name:
    description: Cache segment unique to this target (matrix name)
    required: true
  artifact:
    description: Artifact name suffix, chia-vault-recover-<artifact>
    required: true
  layout:
    description: "suffixed (dist/name-<artifact>) or arch (dist/name, for lipo)"
    required: true
  cross:
    description: "true for the aarch64 CLI-then-GUI build"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}

    # actions/cache does not update a key that already hit, so the key must
    # contain every input that should bust it. Do not add github.sha or
    # run_id: each entry is ~450 MB and five of them already approach 2 GB.
    # target/ is cached so unchanged dependency crates stay Fresh. sccache
    # still covers misses. The root crate links with LTO and is rebuilt from
    # fingerprints; that link is not what this cache is for.
    # Rustflags live in .cargo/config.toml. Cargo ignores that file when
    # RUSTFLAGS is set, including when it is empty, so this hash is of the
    # config file and CI must not set RUSTFLAGS.
    - name: Cache key
      id: cargo-cache
      shell: bash
      run: |
        if [[ -n "${RUSTFLAGS+x}" ]]; then
          echo "::error::RUSTFLAGS is set; Cargo ignores .cargo/config.toml rustflags"
          exit 1
        fi
        rustc_hash="$(rustc -vV | sed -n 's/^commit-hash: //p')"
        flags_hash="$(openssl dgst -sha256 .cargo/config.toml | awk '{print $NF}')"
        lock_hash="$(openssl dgst -sha256 Cargo.lock | awk '{print $NF}')"
        image="$(printf '%s' "${ImageVersion:-unknown}" | tr -c 'A-Za-z0-9_-' '-')"
        {
          echo "rustc=${rustc_hash}"
          echo "flags=${flags_hash}"
          echo "lock=${lock_hash}"
          echo "image=${image}"
        } >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: cargo-${{ inputs.cache-name }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.cargo-cache.outputs.image }}-${{ steps.cargo-cache.outputs.rustc }}-${{ steps.cargo-cache.outputs.flags }}-${{ steps.cargo-cache.outputs.lock }}
        restore-keys: |
          cargo-${{ inputs.cache-name }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.cargo-cache.outputs.image }}-${{ steps.cargo-cache.outputs.rustc }}-${{ steps.cargo-cache.outputs.flags }}-
          cargo-${{ inputs.cache-name }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.cargo-cache.outputs.image }}-${{ steps.cargo-cache.outputs.rustc }}-
          cargo-${{ inputs.cache-name }}-${{ runner.os }}-${{ runner.arch }}-
          cargo-${{ inputs.cache-name }}-

    - uses: mozilla-actions/sccache-action@v0.0.11

    - name: Build
      if: ${{ inputs.cross != 'true' }}
      shell: bash
      run: cargo build --release --target ${{ inputs.target }}

    - name: Build (linux aarch64)
      if: ${{ inputs.cross == 'true' }}
      shell: bash
      run: |
        # CLI always. GUI may lack cross libs; a GUI failure still leaves the CLI artifact.
        cargo build --release --target ${{ inputs.target }} --bin chia-vault-recover
        cargo build --release --target ${{ inputs.target }} --bin chia-vault-recover-gui || \
          echo "GUI cross-build skipped/failed; CLI artifact still produced"

    - name: Stage artifacts
      shell: bash
      run: |
        mkdir -p dist
        target_dir="target/${{ inputs.target }}/release"
        case "${{ inputs.layout }}" in
          arch)
            cp "$target_dir/chia-vault-recover" dist/chia-vault-recover
            cp "$target_dir/chia-vault-recover-gui" dist/chia-vault-recover-gui
            chmod +x dist/*
            ;;
          suffixed)
            ext=""
            if [[ "${{ runner.os }}" == "Windows" ]]; then ext=".exe"; fi
            cp "$target_dir/chia-vault-recover${ext}" "dist/chia-vault-recover-${{ inputs.artifact }}${ext}"
            if [[ -f "$target_dir/chia-vault-recover-gui${ext}" ]]; then
              cp "$target_dir/chia-vault-recover-gui${ext}" "dist/chia-vault-recover-gui-${{ inputs.artifact }}${ext}"
            fi
            ;;
          *)
            echo "::error::layout must be arch or suffixed, got '${{ inputs.layout }}'"
            exit 1
            ;;
        esac

    # api-ms-win-crt-*.dll is the Universal CRT and is allowed. vcruntime/msvcp/
    # concrt/vccorlib are the VC++ redistributable and are not.
    - name: Verify Windows binaries do not import the VC++ redistributable
      if: ${{ contains(inputs.target, 'windows-msvc') }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false

        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        if (-not (Test-Path -LiteralPath $vswhere)) {
          throw "vswhere.exe not found at $vswhere"
        }
        $found = @(
          & $vswhere -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' |
            ForEach-Object { "$_".Trim() } |
            Where-Object { $_ }
        )
        if ($found.Count -eq 0) {
          throw "dumpbin.exe not found"
        }
        $dumpbin = $found | Sort-Object {
          $match = [regex]::Match($_, 'MSVC[\\/](\d+(?:\.\d+){1,3})')
          if (-not $match.Success) { throw "dumpbin path has no MSVC version: $_" }
          [version]$match.Groups[1].Value
        } | Select-Object -Last 1
        if (-not (Test-Path -LiteralPath $dumpbin)) {
          throw "dumpbin.exe not found at $dumpbin"
        }
        Write-Host "dumpbin: $dumpbin"
        $env:PATH = "$(Split-Path -Parent $dumpbin);$env:PATH"

        $exes = @(Get-ChildItem -Path dist -Filter *.exe -File)
        if ($exes.Count -eq 0) {
          throw 'No executables matched dist\*.exe'
        }

        $failed = $false
        foreach ($exe in $exes) {
          Write-Host ""
          Write-Host "===== dumpbin /dependents $($exe.Name) ====="
          $output = @(& $dumpbin /dependents $exe.FullName)
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::$($exe.Name): dumpbin exited $LASTEXITCODE"
            $failed = $true
            continue
          }
          $output | ForEach-Object { Write-Host $_ }
          $imports = @($output | ForEach-Object {
            $name = "$_".Trim()
            if ($name -match '^(?i)[\w.+\-]+\.dll$') { $name }
          })
          if ($imports.Count -eq 0) {
            Write-Host "::error::$($exe.Name) has no parsed DLL imports"
            $failed = $true
            continue
          }
          Write-Host "DLL imports: $($imports -join ', ')"
          foreach ($dll in $imports) {
            if ($dll -match '^(?i)(vcruntime|msvcp|concrt|vccorlib)\d.*\.dll$') {
              Write-Host "::error::$($exe.Name) imports $dll"
              $failed = $true
            }
          }
        }
        if ($failed) { exit 1 }

    # --smoke paints one frame and exits. The DirectX 12 attempt must succeed:
    # a CPU-adapter retry, a logged failure, a non-zero exit, or a hang fails
    # the job. The runner has no Intel GPU; WARP on the first attempt is success.
    - name: Smoke test the Windows GUI
      if: ${{ contains(inputs.target, 'windows-msvc') }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $gui = @(Get-ChildItem -Path dist -Filter 'chia-vault-recover-gui*.exe' -File)
        if ($gui.Count -ne 1) {
          throw "expected one GUI exe in dist, found $($gui.Count)"
        }
        $exe = $gui[0]
        $smokeRoot = Join-Path $env:RUNNER_TEMP 'chia-vault-recover-smoke'
        $appDir = Join-Path $smokeRoot 'app'
        New-Item -ItemType Directory -Force -Path $appDir | Out-Null
        $env:CHIA_VAULT_RECOVER_DIR = $appDir
        $stdout = Join-Path $smokeRoot 'stdout.txt'
        $stderr = Join-Path $smokeRoot 'stderr.txt'
        $log = Join-Path $appDir 'gui.log'
        function Write-SmokeEvidence {
          Write-Host '----- stdout -----'
          if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout | Write-Host }
          Write-Host '----- stderr -----'
          if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr | Write-Host }
          Write-Host '----- gui.log -----'
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log | Write-Host } else { Write-Host '(missing)' }
        }
        Write-Host "Launching $($exe.FullName) --smoke"
        $proc = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke' -PassThru `
          -WorkingDirectory $exe.DirectoryName -WindowStyle Normal `
          -RedirectStandardOutput $stdout -RedirectStandardError $stderr
        $timeoutMs = 90000
        if (-not $proc.WaitForExit($timeoutMs)) {
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          $null = $proc.WaitForExit()
          Write-Host "::error::GUI smoke test did not exit within $($timeoutMs / 1000)s"
          Write-SmokeEvidence
          exit 1
        }
        # WaitForExit(int) can return before redirected output and ExitCode are ready.
        $null = $proc.WaitForExit()
        Write-Host "smoke exit code: $($proc.ExitCode)"
        $logText = ''
        if (Test-Path -LiteralPath $log) {
          $logText = [string](Get-Content -LiteralPath $log -Raw)
        }
        $reasons = @()
        if ($proc.ExitCode -ne 0) {
          $reasons += "GUI smoke test exited $($proc.ExitCode)"
        }
        if ($logText -notmatch 'smoke: first frame') {
          $reasons += 'GUI smoke test exited without painting a frame'
        }
        if ($logText -notmatch '(?m)^[0-9]+ attempt: dx12$') {
          $reasons += 'GUI smoke test did not log the DirectX 12 attempt'
        }
        if ($logText -notmatch '(?m)^[0-9]+ request_device: ') {
          $reasons += 'GUI smoke test did not log device creation'
        }
        if ($logText -notmatch '(?m)^[0-9]+ first frame$') {
          $reasons += 'GUI smoke test did not log the first frame'
        }
        if ($logText -match 'attempt: dx12-cpu') {
          $reasons += 'GUI smoke test needed the CPU renderer fallback'
        }
        if ($logText -match 'failed:' -or $logText -match 'ERROR:' -or $logText -match 'panic at ' -or $logText -match '(?m)^[0-9]+ panic:') {
          $reasons += 'GUI smoke test log recorded a failure'
        }
        if ($reasons.Count -gt 0) {
          foreach ($reason in $reasons) { Write-Host "::error::$reason" }
          Write-SmokeEvidence
          exit 1
        }
        Write-SmokeEvidence

    - name: Upload CI artifacts
      uses: actions/upload-artifact@v7
      with:
        name: chia-vault-recover-${{ inputs.artifact }}
        path: dist/*
        if-no-files-found: error
